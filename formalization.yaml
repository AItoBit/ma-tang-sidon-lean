fidelity:
  divergences: Partial paper coverage, explicitly disclosed. Theorem1.3 uses natural(n+2)/2, equal
    to the source ceiling for n>=1. The generic Fekete lemma uses a bounded-below condition; nonnegativity
    supplies it in the applications. Theorem4.6 uses a complete alternate proof. No weakened replacement
    is claimed for omitted5.3 or lower1.6.
