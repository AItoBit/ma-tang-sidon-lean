    framework: ChatGPT Codex Work Mode
    tool_setup: Multi-agent proof development and independent agent source-fidelity review; Lean4
      and pinnedMathlib; kernel-checked decide for finite certificates.
    prompting_notes: User requested full source-faithful formalization without proof holes or new
      mathematical axioms. Later explicitly authorized submission of the verified subset as partial.
