version: v0.4
project:
  name: Selected Sidon subset theorems of Ma–Tang (partial paper formalization)
  description: 'Lean 4 proofs of the exact largest-Sidon-subset guarantee g(n)=ceil((n+1)/2) for
    finite weak Sidon sets, its asymptotic density 1/2, convergence and the optimal-constant characterization
    for finite (4,5)-sets, and the upper bound cStar<=4/7. The project also proves the finite three-uniform
    transversal bound 4tau<=n+m used in the exact guarantee. This is a partial formalization of Ma–Tang,
    arXiv:2602.23282v2: Theorem5.3 and the lower9/17 bound in Theorem1.6 remain unproved.'
  authors:
  - AItoBit
  license: Apache-2.0
  responsible_maintainers:
  - AItoBit
